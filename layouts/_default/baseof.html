<!DOCTYPE html>
<html lang="en">
    <head>
        <title> {{ .Site.Title }} </title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, shrink-to-fit=no" />
        <meta name="robots" content="noindex, nofollow" />
        <link rel="icon" href="{{ .Site.BaseURL }}/image/favicon.png">

        <!-- <link href="style.css" rel="stylesheet" /> -->
        <link href="{{ .Site.BaseURL }}/css/style.css" rel="stylesheet" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&family=Noto+Serif&display=swap" rel="stylesheet">
        {{ block "dynamic_styles" . -}}{{- end }}
    </head>
    <body id="top">
        <div id="password-gate">
            <div id="password-gate__box">
                <p id="password-gate__title">Adhi &amp; Izzy's Wedding</p>
                <p id="password-gate__subtitle">Please enter the password from your invitation</p>
                <input id="password-gate__input" type="password" placeholder="Password" autocomplete="current-password" />
                <p id="password-gate__error" hidden>Incorrect password. Please try again.</p>
                <button id="password-gate__submit">Enter</button>
            </div>
        </div>
        {{ block "main" . -}}{{- end }}
        <script src="{{ .Site.BaseURL }}/js/script.js"></script>
    </body>
</html>
